spring.application.name=resume-ai-backend

# ===================== AI MODEL (Groq - free & fast) =====================
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.options.model=openai/gpt-oss-120b

# ===================== DATABASE (MySQL) =====================
# 1. Install MySQL and create a database first:
#    CREATE DATABASE resume_ai_db;
# 2. Update username/password below to match your local MySQL setup.
spring.datasource.url=jdbc:mysql://localhost:3306/resume_ai_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ddl-auto=update -> Hibernate automatically creates/updates the "users" table for you
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===================== JWT =====================
# Secret key used to sign JWT tokens - change this in production and keep it out of source control
jwt.secret=${JWT_SECRET}
# Access token validity in milliseconds (24 hours)
jwt.expiration-ms=${JWT_EXPIRATION}


